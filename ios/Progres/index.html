<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Progres">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1416" media="(prefers-color-scheme: dark)">
<title>Progres Treningowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, a single working card per screen,
   plate-style condensed numerals for every kg/rep figure, tab bar at the thumb. */
:root{
  --bg:#EEF2F2; --surface:#FFFFFF; --ink:#0F1F22; --muted:#5E7175; --line:#D9E1E2;
  --accent:#F59A23; --accent-ink:#231300; --trace:#0B8FA0;
  --good:#18794E; --good-bg:#DDF3E7; --flat:#5E7175; --flat-bg:#E6ECEC; --bad:#B4381F; --bad-bg:#FBE3DC;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1416; --surface:#132024; --ink:#E9F1F1; --muted:#8DA2A6; --line:#22353A;
    --accent:#F7A63A; --accent-ink:#1F1000; --trace:#3CC3D3;
    --good:#5FD39A; --good-bg:#12362A; --flat:#8DA2A6; --flat-bg:#1C2D31; --bad:#F08C74; --bad-bg:#3A1C15;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1416; --surface:#132024; --ink:#E9F1F1; --muted:#8DA2A6; --line:#22353A;
  --accent:#F7A63A; --accent-ink:#1F1000; --trace:#3CC3D3;
  --good:#5FD39A; --good-bg:#12362A; --flat:#8DA2A6; --flat-bg:#1C2D31; --bad:#F08C74; --bad-bg:#3A1C15;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--trace);outline-offset:2px}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
header{padding:calc(14px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--flat)}
.sync.ok i{background:var(--good)}
main{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px}
main>*{flex:none}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.demo{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.newex{display:flex;gap:8px}
.field{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--flat-bg);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);height:54px;font-size:17px;font-weight:700;width:100%}
.btn.ghost{background:none;border:1px dashed var(--line);color:var(--muted);width:100%}
.last{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:14px;color:var(--muted)}
.last b{font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.sets{display:flex;flex-direction:column;gap:10px}
.set{display:grid;grid-template-columns:18px 1fr 1fr 30px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.step{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;background:var(--bg);border-radius:12px;height:52px}
.step button{height:52px;font-size:22px;color:var(--muted)}
.step .v{display:flex;flex-direction:column;align-items:center;line-height:1}
.step input{width:100%;border:0;background:none;text-align:center;font-family:var(--display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.step small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rm{height:44px;color:var(--muted);font-size:20px}
.verdict{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.verdict.up{background:var(--good-bg);color:var(--good)}
.verdict.same,.verdict.first{background:var(--flat-bg);color:var(--flat)}
.verdict.down{background:var(--bad-bg);color:var(--bad)}
.verdict span{font-weight:400}
.row{display:flex;gap:10px;align-items:center}
.row .field{flex:1}
.hist{display:flex;flex-direction:column}
.day{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 0 4px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item .name{font-weight:600;font-size:15px}
.item .s{font-family:var(--display);font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.item button{font-size:13px;color:var(--muted);padding:8px;border-radius:8px;flex:none}
.item button.sure{background:var(--bad-bg);color:var(--bad);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:3px}
.seg button{height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--display);font-weight:700;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums}
.big em{font-style:normal;color:var(--muted);font-size:14px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.up{background:var(--good-bg);color:var(--good)}
.pill.same,.pill.first{background:var(--flat-bg);color:var(--flat)}
.pill.down{background:var(--bad-bg);color:var(--bad)}
svg.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.readout{font-size:13px;color:var(--muted);min-height:18px;font-variant-numeric:tabular-nums}
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav h2{font-family:var(--display);font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.monthnav button{width:44px;height:44px;border-radius:12px;background:var(--surface);font-size:20px}
.monthnav button:disabled{opacity:.3}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal i{aspect-ratio:1;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal i.on{background:var(--trace);color:var(--surface);font-weight:700}
.cal i.off{background:none}
.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:0}
.mrow .name{font-weight:600}
.mrow .s{grid-column:1/-1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px}
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] svg{stroke:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Progres</h1>
    <div class="sync" id="sync"><i></i><span>Zapis na tym telefonie</span></div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M3 12h18M6 7v10M18 7v10M2.5 9.5v5M21.5 9.5v5"/></svg>Trening</button>
    <button data-tab="chart"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/></svg>Postęp</button>
    <button data-tab="month"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Miesiąc</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
var LS="progres-v1";
var DEFAULTS=["Przysiad","Wyciskanie leżąc","Martwy ciąg","Hip thrust","Wiosłowanie","Wyciskanie nad głowę","Podciąganie"];
var S={entries:[],demo:false,tab:"log",ex:null,draft:[],date:ymd(new Date()),extra:[],metric:"top",month:ymd(new Date()).slice(0,7),adding:false,sure:null};
var col=null, writeChain=Promise.resolve();
var main=document.getElementById("main");

/* ---------- helpers ---------- */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toDate(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(n){return (Math.round(n*10)/10).toLocaleString("pl-PL",{maximumFractionDigits:1})}
function signed(n){return (n>0?"+":"−")+num(Math.abs(n))}
function dShort(s){return toDate(s).toLocaleDateString("pl-PL",{day:"numeric",month:"short"})}
function dLong(s){return toDate(s).toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"})}
function mName(m){return toDate(m+"-01").toLocaleDateString("pl-PL",{month:"long",year:"numeric"})}
function shiftMonth(m,k){var d=toDate(m+"-01");d.setMonth(d.getMonth()+k);return ymd(d).slice(0,7)}
function best(sets){var b=null;sets.forEach(function(s){if(!b||s[0]>b[0]||(s[0]===b[0]&&s[1]>b[1]))b=s});return b}
function vol(sets){return sets.reduce(function(a,s){return a+s[0]*s[1]},0)}
function e1rm(s){return s[0]*(1+s[1]/30)}
function setsText(sets){
  var kg=sets[0][0], same=sets.every(function(s){return s[0]===kg});
  if(same)return num(kg)+" kg × "+sets.map(function(s){return s[1]}).join(", ");
  return sets.map(function(s){return num(s[0])+"×"+s[1]}).join("  ");
}
function sorted(list){return list.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.id<b.id?-1:1)})}
function forEx(ex){return sorted(S.entries.filter(function(e){return e.ex===ex}))}
function exercises(){
  var seen=[], rec=sorted(S.entries).reverse();
  rec.forEach(function(e){if(seen.indexOf(e.ex)<0)seen.push(e.ex)});
  S.extra.concat(DEFAULTS).forEach(function(n){if(seen.indexOf(n)<0)seen.push(n)});
  return seen;
}
/* Compare two sessions: top weight first, then reps in the best set, then volume. */
function compare(cur,prev){
  if(!prev||!prev.length)return{kind:"first",short:"start",text:"Pierwszy zapis tego ćwiczenia."};
  var a=best(cur),b=best(prev);
  if(a[0]!==b[0]){var d=a[0]-b[0];return{kind:d>0?"up":"down",short:signed(d)+" kg",text:signed(d)+" kg w najlepszej serii"}}
  if(a[1]!==b[1]){var r=a[1]-b[1];return{kind:r>0?"up":"down",short:signed(r)+" powt.",text:signed(r)+" powt. przy "+num(a[0])+" kg"}}
  var v=vol(cur)-vol(prev);
  if(v!==0)return{kind:v>0?"up":"down",short:signed(v)+" kg obj.",text:signed(v)+" kg objętości"};
  return{kind:"same",short:"bez zmian",text:"Tak samo jak ostatnio"};
}
function stalled(ex){
  var l=forEx(ex);if(l.length<4)return false;
  for(var i=l.length-1;i>l.length-4;i--){if(compare(l[i].sets,l[i-1].sets).kind==="up")return false}
  return true;
}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},1800)}
function setSync(ok,text){var el=document.getElementById("sync");el.className="sync"+(ok?" ok":"");el.lastElementChild.textContent=text}

/* ---------- example data, shown only until the first real entry ---------- */
function demoData(){
  var out=[],plan=[["Przysiad",40,2.5],["Wyciskanie leżąc",27.5,2.5],["Hip thrust",60,5]],today=new Date();
  for(var w=8;w>=0;w--){for(var k=0;k<2;k++){
    var d=new Date(today);d.setDate(d.getDate()-w*7-(k?1:4));if(d>today)continue;
    var i=(8-w)*2+k;
    plan.forEach(function(p,j){
      if((i+j)%3===2)return;
      var kg=p[1]+Math.floor(i/4)*p[2], r=6+(i%4)-(j===1&&i%4===3?1:0);
      out.push({id:"demo"+i+"_"+j,d:ymd(d),ex:p[0],sets:[[kg,r],[kg,r],[kg,Math.max(4,r-1)]]});
    });
  }}
  return out;
}

/* ---------- storage: private per-person documents, one per month ---------- */
var NATIVE=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.progres;
function cacheLocal(){var j=JSON.stringify(S.demo?[]:S.entries);if(NATIVE){try{NATIVE.postMessage({type:"save",json:j});window.__progresNative=JSON.parse(j)}catch(e){}return}try{localStorage.setItem(LS,j)}catch(e){}}
function readLocal(){if(NATIVE){var n=window.__progresNative;return Array.isArray(n)?n:[]}try{var v=JSON.parse(localStorage.getItem(LS)||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}
function saveMonth(m){
  cacheLocal();
  if(!col)return;
  var list=S.entries.filter(function(e){return e.d.slice(0,7)===m});
  writeChain=writeChain.then(function(){
    var ref=col.doc("m-"+m);
    return list.length?ref.set({entries:list}):ref.delete();
  }).then(function(){setSync(true,"Zapisane na koncie")},function(){setSync(false,"Zapis się nie udał. Dane są na tym urządzeniu")});
}
function adopt(list){
  if(list.length){S.entries=list;S.demo=false}else{S.entries=demoData();S.demo=true}
  var ex=exercises();if(!S.ex||ex.indexOf(S.ex)<0)pickEx(ex[0]);
  render();
}
function boot(){
  adopt(readLocal());
  var use=window.claude&&window.claude.use;
  if(!use){setSync(true,"Zapis na tym telefonie");return}
  Promise.all([use("db"),use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)throw 0;
    return user.id().then(function(uid){
      if(!uid)throw 0;
      col=db.collection("data/users/"+uid);
      return Promise.race([col.get(),new Promise(function(_,rej){setTimeout(rej,10000)})]);
    });
  }).then(function(snap){
    var remote=[];
    snap.docs.forEach(function(d){var b=d.data();if(b&&Array.isArray(b.entries))remote=remote.concat(b.entries)});
    var local=readLocal();
    if(remote.length){adopt(remote);cacheLocal()}
    else if(local.length){var ms={};local.forEach(function(e){ms[e.d.slice(0,7)]=1});Object.keys(ms).forEach(saveMonth)}
    setSync(true,"Zapisane na koncie");
  }).catch(function(){if(!col)setSync(false,"Tylko na tym urządzeniu");else setSync(false,"Brak połączenia. Dane z tego urządzenia")});
}

/* ---------- actions ---------- */
function pickEx(ex){
  S.ex=ex;
  var l=forEx(ex), last=l[l.length-1];
  S.draft=last?last.sets.map(function(s){return{kg:s[0],reps:s[1]}}):[{kg:20,reps:8},{kg:20,reps:8},{kg:20,reps:8}];
}
function draftSets(){return S.draft.filter(function(s){return s.reps>0}).map(function(s){return[s.kg,s.reps]})}
function save(){
  var sets=draftSets();if(!sets.length){toast("Dodaj przynajmniej jedną serię");return}
  if(S.demo){S.entries=[];S.demo=false}
  S.entries.push({id:Date.now().toString(36),d:S.date,ex:S.ex,sets:sets});
  saveMonth(S.date.slice(0,7));
  S.month=S.date.slice(0,7);
  toast("Zapisano: "+S.ex);render();
}
function removeEntry(id){
  var e=S.entries.filter(function(x){return x.id===id})[0];if(!e)return;
  S.entries=S.entries.filter(function(x){return x.id!==id});S.sure=null;
  if(S.demo){if(!S.entries.length)S.entries=demoData()}
  else{saveMonth(e.d.slice(0,7));if(!S.entries.length){S.entries=demoData();S.demo=true}}
  render();
}

/* ---------- views ---------- */
function chipsHTML(){
  return '<div class="chips" id="chips">'+exercises().map(function(n){
    return '<button class="chip" data-ex="'+esc(n)+'" aria-pressed="'+(n===S.ex)+'">'+esc(n)+'</button>'}).join("")+
    '<button class="chip add" data-act="add">+ Nowe ćwiczenie</button></div>'+
    (S.adding?'<div class="newex"><input class="field" id="newex" placeholder="Nazwa ćwiczenia" maxlength="40" autocomplete="off"><button class="btn" data-act="addok">Dodaj</button></div>':"");
}
function demoHTML(){return S.demo?'<div class="demo">To przykładowe dane, żeby było widać jak działa aplikacja. Znikną po zapisaniu pierwszego treningu.</div>':""}
function verdictHTML(){
  var cur=draftSets(),l=forEx(S.ex),last=l[l.length-1];
  if(!cur.length)return "";
  var c=compare(cur,last&&last.sets);
  var extra=c.kind!=="up"&&stalled(S.ex)?" <span>Trzy treningi bez progresu. Może czas zmienić ćwiczenie.</span>":"";
  var icon=c.kind==="up"?"▲":c.kind==="down"?"▼":"●";
  return '<div class="verdict '+c.kind+'">'+icon+' <div>'+esc(c.text)+(c.kind==="first"?"":' <span>względem '+dShort(last.d)+'</span>')+extra+'</div></div>';
}
function viewLog(){
  var l=forEx(S.ex),last=l[l.length-1];
  var h=demoHTML()+chipsHTML()+'<section class="card">'+
    '<div class="last"><span>'+(last?"Ostatnio, "+dShort(last.d):"Brak wcześniejszych zapisów")+'</span>'+(last?'<b>'+esc(setsText(last.sets))+'</b>':"")+'</div>'+
    '<div class="sets">'+S.draft.map(function(s,i){return '<div class="set"><div class="n">'+(i+1)+'</div>'+
      stepHTML(i,"kg",s.kg,"kg","0.5")+stepHTML(i,"reps",s.reps,"powt.","1")+
      '<button class="rm" data-act="rm" data-i="'+i+'" aria-label="Usuń serię '+(i+1)+'">×</button></div>'}).join("")+'</div>'+
    '<button class="btn ghost" data-act="addset">+ Dodaj serię</button>'+
    '<div id="verdict">'+verdictHTML()+'</div>'+
    '<div class="row"><label class="label" for="date">Data</label><input class="field" type="date" id="date" value="'+S.date+'" max="'+ymd(new Date())+'"></div>'+
    '<button class="btn primary" data-act="save">Zapisz trening</button></section>';
  var rec=sorted(S.entries).reverse().slice(0,40),day="";
  h+='<section class="card"><div class="label">Historia</div><div class="hist">';
  rec.forEach(function(e){
    if(e.d!==day){day=e.d;h+='<div class="day">'+esc(dLong(e.d))+'</div>'}
    h+='<div class="item"><div><div class="name">'+esc(e.ex)+'</div><div class="s">'+esc(setsText(e.sets))+'</div></div>'+
      '<button data-act="del" data-id="'+esc(e.id)+'" class="'+(S.sure===e.id?"sure":"")+'">'+(S.sure===e.id?"Na pewno?":"Usuń")+'</button></div>';
  });
  return h+'</div></section>';
}
function stepHTML(i,key,val,unit,step){
  return '<div class="step"><button data-act="dec" data-i="'+i+'" data-k="'+key+'" aria-label="Mniej '+unit+'">−</button>'+
    '<div class="v"><input id="s'+i+key+'" data-i="'+i+'" data-k="'+key+'" type="number" inputmode="decimal" min="0" step="'+step+'" value="'+val+'" aria-label="Seria '+(i+1)+', '+unit+'"><small>'+unit+'</small></div>'+
    '<button data-act="inc" data-i="'+i+'" data-k="'+key+'" aria-label="Więcej '+unit+'">+</button></div>';
}
var METRICS={top:{name:"Ciężar",unit:"kg",f:function(e){return best(e.sets)[0]}},
             rm:{name:"Szac. 1RM",unit:"kg",f:function(e){return e1rm(best(e.sets))}},
             vol:{name:"Objętość",unit:"kg",f:function(e){return vol(e.sets)}}};
function viewChart(){
  var l=forEx(S.ex),m=METRICS[S.metric];
  var h=demoHTML()+chipsHTML()+'<section class="card"><div class="seg">'+Object.keys(METRICS).map(function(k){
    return '<button data-metric="'+k+'" aria-pressed="'+(k===S.metric)+'">'+METRICS[k].name+'</button>'}).join("")+'</div>';
  if(!l.length)return h+'<p class="empty">Brak zapisów dla tego ćwiczenia. Dodaj pierwszy w zakładce Trening.</p></section>';
  var vals=l.map(m.f),lastV=vals[vals.length-1],d=lastV-vals[0];
  h+='<div class="big"><b>'+num(lastV)+'</b><em>'+m.unit+' · '+dShort(l[l.length-1].d)+'</em>'+
     (l.length>1?'<span class="pill '+(d>0?"up":d<0?"down":"same")+'">'+(d===0?"bez zmian":signed(d)+" "+m.unit)+' od '+dShort(l[0].d)+'</span>':"")+'</div>';
  h+=chartSVG(l,vals)+'<div class="readout" id="readout">'+(l.length>1?"Dotknij wykresu, żeby zobaczyć dany trening.":"Wykres pojawi się po drugim treningu.")+'</div></section>';
  h+='<section class="card"><div class="label">Trening po treningu</div><div class="hist">';
  for(var i=l.length-1;i>=0&&i>=l.length-12;i--){
    var c=compare(l[i].sets,i?l[i-1].sets:null);
    h+='<div class="item"><div><div class="name">'+dShort(l[i].d)+'</div><div class="s">'+esc(setsText(l[i].sets))+'</div></div><span class="pill '+c.kind+'">'+esc(c.short)+'</span></div>';
  }
  return h+'</div></section>';
}
var CH={w:340,h:170,l:36,r:14,t:14,b:22},chartPts=[];
function chartSVG(l,vals){
  var t0=toDate(l[0].d).getTime(),t1=toDate(l[l.length-1].d).getTime(),span=Math.max(1,t1-t0);
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);if(hi===lo){hi+=1;lo-=1}
  var pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  var X=function(e){return l.length===1?(CH.l+CH.w-CH.r)/2:CH.l+(toDate(e.d).getTime()-t0)/span*(CH.w-CH.l-CH.r)};
  var Y=function(v){return CH.t+(hi-v)/(hi-lo)*(CH.h-CH.t-CH.b)};
  chartPts=l.map(function(e,i){return{x:X(e),y:Y(vals[i]),v:vals[i],e:e}});
  var s='<svg class="chart" id="chart" viewBox="0 0 '+CH.w+' '+CH.h+'" role="img" aria-label="Wykres postępu: '+esc(S.ex)+'">';
  for(var g=0;g<3;g++){var gv=lo+pad+(hi-lo-2*pad)*g/2,gy=Y(gv);
    s+='<line x1="'+CH.l+'" x2="'+(CH.w-CH.r)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--line)" stroke-dasharray="2 4"/><text x="'+(CH.l-6)+'" y="'+(gy+3)+'" text-anchor="end">'+num(gv)+'</text>'}
  var path=chartPts.map(function(p,i){return(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)}).join(" ");
  if(chartPts.length>1){
    s+='<path d="'+path+' L'+chartPts[chartPts.length-1].x.toFixed(1)+' '+(CH.h-CH.b)+' L'+chartPts[0].x.toFixed(1)+' '+(CH.h-CH.b)+' Z" fill="var(--trace)" opacity=".12"/>';
    s+='<path d="'+path+'" fill="none" stroke="var(--trace)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  chartPts.forEach(function(p,i){var end=i===chartPts.length-1;
    s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(end?5.5:2.5)+'" fill="'+(end?"var(--accent)":"var(--trace)")+'"'+(end?' stroke="var(--surface)" stroke-width="2.5"':"")+'/>'});
  s+='<circle id="mark" r="6" fill="none" stroke="var(--ink)" stroke-width="2" visibility="hidden"/>';
  s+='<text x="'+CH.l+'" y="'+(CH.h-6)+'">'+dShort(l[0].d)+'</text>';
  if(l.length>1)s+='<text x="'+(CH.w-CH.r)+'" y="'+(CH.h-6)+'" text-anchor="end">'+dShort(l[l.length-1].d)+'</text>';
  return s+'</svg>';
}
function probe(ev){
  var svg=document.getElementById("chart");if(!svg||chartPts.length<2)return;
  var r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*CH.w,p=chartPts[0];
  chartPts.forEach(function(q){if(Math.abs(q.x-x)<Math.abs(p.x-x))p=q});
  var mk=document.getElementById("mark");mk.setAttribute("cx",p.x);mk.setAttribute("cy",p.y);mk.setAttribute("visibility","visible");
  document.getElementById("readout").textContent=dShort(p.e.d)+" · "+num(p.v)+" "+METRICS[S.metric].unit+" · "+setsText(p.e.sets);
}
function viewMonth(){
  var m=S.month,pm=shiftMonth(m,-1),now=ymd(new Date()).slice(0,7);
  var cur=S.entries.filter(function(e){return e.d.slice(0,7)===m}),prev=S.entries.filter(function(e){return e.d.slice(0,7)===pm});
  var days={};cur.forEach(function(e){days[e.d]=1});
  var nSets=cur.reduce(function(a,e){return a+e.sets.length},0),v=cur.reduce(function(a,e){return a+vol(e.sets)},0),pv=prev.reduce(function(a,e){return a+vol(e.sets)},0);
  var h=demoHTML()+'<div class="monthnav"><button data-act="pm" aria-label="Poprzedni miesiąc">‹</button><h2>'+esc(mName(m))+'</h2><button data-act="nm" aria-label="Następny miesiąc"'+(m>=now?" disabled":"")+'>›</button></div>';
  h+='<div class="tiles"><div class="tile"><b>'+Object.keys(days).length+'</b><span>dni treningowe</span></div><div class="tile"><b>'+nSets+'</b><span>serie</span></div><div class="tile"><b>'+num(v/1000)+'</b><span>ton objętości</span></div></div>';
  var first=toDate(m+"-01"),off=(first.getDay()+6)%7,n=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  h+='<section class="card"><div class="label">Kiedy był trening</div><div class="cal">';
  for(var i=0;i<off;i++)h+='<i class="off"></i>';
  for(var d=1;d<=n;d++){var k=m+"-"+String(d).padStart(2,"0");h+='<i class="'+(days[k]?"on":"")+'">'+d+'</i>'}
  h+='</div></section><section class="card"><div class="label">Porównanie z: '+esc(mName(pm))+'</div><div>';
  if(!cur.length)h+='<p class="empty">W tym miesiącu nie ma jeszcze zapisanych treningów.</p>';
  else{
    if(pv>0){var dv=v-pv;h+='<div class="mrow"><div class="name">Łączna objętość</div><span class="pill '+(dv>0?"up":dv<0?"down":"same")+'">'+(dv===0?"bez zmian":signed(dv/pv*100)+"%")+'</span><div class="s">'+num(v)+' kg, wcześniej '+num(pv)+' kg</div></div>'}
    var names=[];cur.forEach(function(e){if(names.indexOf(e.ex)<0)names.push(e.ex)});
    names.forEach(function(nm){
      var a=best([].concat.apply([],cur.filter(function(e){return e.ex===nm}).map(function(e){return e.sets})));
      var ps=[].concat.apply([],prev.filter(function(e){return e.ex===nm}).map(function(e){return e.sets}));
      var b=ps.length?best(ps):null,c=compare([a],b?[b]:null);
      h+='<div class="mrow"><div class="name">'+esc(nm)+'</div><span class="pill '+c.kind+'">'+esc(c.kind==="first"?"nowe":c.short)+'</span><div class="s">Najlepsza seria '+num(a[0])+' kg × '+a[1]+(b?", wcześniej "+num(b[0])+" kg × "+b[1]:"")+'</div></div>';
    });
  }
  h+='</div></section><section class="card"><div class="label">Kopia zapasowa</div><p class="empty">Treningi są zapisane tylko w tej aplikacji na telefonie. Co jakiś czas pobierz kopię, żeby ich nie stracić.</p><div class="row"><button class="btn" data-act="export" style="flex:1">Pobierz kopię</button><button class="btn" data-act="import" style="flex:1">Wczytaj kopię</button></div><input type="file" id="file" accept=".json,application/json" hidden>';
  return h+'</section>';
}
function render(){
  var keep=main.scrollTop,cs=document.getElementById("chips"),cx=cs?cs.scrollLeft:0;
  main.innerHTML=S.tab==="log"?viewLog():S.tab==="chart"?viewChart():viewMonth();
  main.scrollTop=keep;cs=document.getElementById("chips");if(cs)cs.scrollLeft=cx;
  [].forEach.call(document.querySelectorAll("nav button"),function(b){if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(S.adding){var f=document.getElementById("newex");if(f)f.focus()}
}

/* ---------- events ---------- */
document.querySelector("nav").addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;S.tab=b.dataset.tab;S.sure=null;main.scrollTop=0;render()});
main.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  var a=b.dataset.act,i=+b.dataset.i,k=b.dataset.k;
  if(b.dataset.ex){pickEx(b.dataset.ex);S.adding=false}
  else if(b.dataset.metric)S.metric=b.dataset.metric;
  else if(a==="add")S.adding=!S.adding;
  else if(a==="addok"){var v=document.getElementById("newex").value.trim();if(!v)return;
    var hit=exercises().filter(function(n){return n.toLowerCase()===v.toLowerCase()})[0];
    if(!hit){S.extra.unshift(v);hit=v}pickEx(hit);S.adding=false}
  else if(a==="inc"||a==="dec"){var st=k==="kg"?2.5:1,s=S.draft[i];s[k]=Math.max(0,Math.round((s[k]+(a==="inc"?st:-st))*100)/100)}
  else if(a==="addset"){var p=S.draft[S.draft.length-1]||{kg:20,reps:8};S.draft.push({kg:p.kg,reps:p.reps})}
  else if(a==="rm")S.draft.splice(i,1);
  else if(a==="save"){save();return}
  else if(a==="del"){if(S.sure===b.dataset.id){removeEntry(b.dataset.id);return}S.sure=b.dataset.id}
  else if(a==="export"){
    if(S.demo){toast("Nie ma jeszcze czego zapisać");return}
    if(NATIVE){NATIVE.postMessage({type:"export",name:"progres-"+ymd(new Date())+".json",json:JSON.stringify({app:"progres",entries:S.entries},null,1)});return}
    var u=URL.createObjectURL(new Blob([JSON.stringify({app:"progres",entries:S.entries},null,1)],{type:"application/json"})),l=document.createElement("a");
    l.href=u;l.download="progres-"+ymd(new Date())+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);return}
  else if(a==="import"){document.getElementById("file").click();return}
  else if(a==="pm")S.month=shiftMonth(S.month,-1);
  else if(a==="nm")S.month=shiftMonth(S.month,1);
  else return;
  render();
});
main.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="date"){if(t.value)S.date=t.value;return}
  if(t.dataset.k){var v=parseFloat(String(t.value).replace(",","."));S.draft[+t.dataset.i][t.dataset.k]=isFinite(v)&&v>=0?(t.dataset.k==="reps"?Math.round(v):v):0;
    document.getElementById("verdict").innerHTML=verdictHTML()}
});
main.addEventListener("change",function(ev){
  if(ev.target.id!=="file"||!ev.target.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){try{
    var j=JSON.parse(fr.result),list=Array.isArray(j)?j:j.entries;
    var ok=Array.isArray(list)&&list.every(function(e){return e&&typeof e.d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(e.d)&&typeof e.ex==="string"&&Array.isArray(e.sets)&&e.sets.length&&e.sets.every(function(s){return Array.isArray(s)&&isFinite(s[0])&&isFinite(s[1])})});
    if(!ok||!list.length)throw 0;
    var ids={};if(!S.demo)S.entries.forEach(function(e){ids[e.id]=1});
    var add=list.filter(function(e){return !ids[e.id]}).map(function(e,i){return{id:String(e.id||("i"+Date.now().toString(36)+i)),d:e.d,ex:e.ex.slice(0,40),sets:e.sets.map(function(s){return[+s[0],Math.round(+s[1])]})}});
    S.entries=(S.demo?[]:S.entries).concat(add);S.demo=false;cacheLocal();toast("Wczytano treningów: "+add.length);render();
  }catch(e){toast("Ten plik nie jest kopią z tej aplikacji")}};
  fr.readAsText(ev.target.files[0]);
});
main.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.id==="newex"){ev.preventDefault();main.querySelector('[data-act="addok"]').click()}});
main.addEventListener("focusin",function(ev){if(ev.target.dataset&&ev.target.dataset.k)ev.target.select()});
main.addEventListener("pointerdown",function(ev){if(ev.target.closest("#chart"))probe(ev)});
main.addEventListener("pointermove",function(ev){if(ev.target.closest("#chart"))probe(ev)});

boot();
})();
</script>
</body>
